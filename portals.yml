# Portal Scanner Configuration — Saurabh Jalendra
# Research Engineer roles at AI labs and research institutions

title_filter:
  positive:
    # Research roles
    - "Research Engineer"
    - "Research Scientist"
    - "Applied Scientist"
    - "ML Research"
    - "AI Research"
    - "Research Associate"
    # ML/AI Engineering roles
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "AI Engineer"
    - "Deep Learning Engineer"
    # Specific domains
    - "Reinforcement Learning"
    - "World Model"
    - "Scientific Computing"
    - "Simulation"
    - "LLM Engineer"
    - "Agent Engineer"
    - "NLP Engineer"
    # Platform/Infra roles
    - "ML Platform"
    - "MLOps"
    - "AI Infrastructure"
    - "Training Engineer"
  negative:
    # Too senior
    - "Director"
    - "VP"
    - "Principal"
    - "Head of"
    - "Chief"
    # Too junior
    - "Intern"
    - "Junior"
    - "Entry Level"
    - "Graduate"
    # Wrong track
    - "Sales Engineer"
    - "Marketing"
    - "Recruiter"
    - "Designer"
    - "Product Manager"
    - "Project Manager"
    # Wrong stack
    - "iOS"
    - "Android"
    - ".NET"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"

